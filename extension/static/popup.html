<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>filterx</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      body {
        width: 360px;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
      }
      section {
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
      }
      .notice {
        display: block;
        padding: 10px 16px;
        border-bottom: 1px solid var(--line);
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
      }
      .notice:hover {
        background: rgba(29, 155, 240, 0.08);
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      .stat b {
        display: block;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
      }
      .stat span {
        font-size: 12px;
        color: var(--muted);
      }
      .row {
        display: grid;
        grid-template-columns: 84px 1fr;
        align-items: center;
        gap: 10px;
      }
      .row + .row {
        margin-top: 10px;
      }
      .row label {
        font-size: 13px;
        color: var(--muted);
      }
      .list-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        padding: 12px 16px 6px;
      }
      .list-head h2 {
        font-size: 13px;
        font-weight: 700;
      }
      #recent {
        max-height: 268px;
        overflow-y: auto;
        scrollbar-width: thin;
      }
      .item {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 4px 8px;
        padding: 9px 16px;
        transition: background 0.12s;
      }
      .item:hover {
        background: rgba(231, 233, 234, 0.03);
      }
      .item-meta {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--muted);
        min-width: 0;
      }
      .item-text {
        grid-column: 1;
        font-size: 13px;
        color: #c4c7c9;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .item-actions {
        grid-row: 1 / span 2;
        grid-column: 2;
        display: flex;
        align-items: center;
        opacity: 0.4;
        transition: opacity 0.12s;
      }
      .item:hover .item-actions {
        opacity: 1;
      }
      .item.kept {
        opacity: 0.45;
      }
      .empty {
        padding: 16px;
        text-align: center;
        font-size: 13px;
        color: var(--muted);
      }
      footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 16px;
        border-top: 1px solid var(--line);
        font-size: 12px;
        color: var(--muted);
      }
      footer a {
        color: var(--text);
        text-decoration: none;
        font-weight: 600;
      }
      footer a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand"><span class="brand-mark"></span>filterx</div>
      <label class="switch" title="Filtering on/off"><input type="checkbox" id="enabled" /></label>
    </header>
    <a class="notice" id="setup" href="options.html" target="_blank" hidden>Connect Clef to start filtering →</a>
    <section class="stats">
      <div class="stat"><b id="s-hidden">0</b><span>hidden today</span></div>
      <div class="stat"><b id="s-analyzed">0</b><span>analyzed</span></div>
      <div class="stat"><b id="s-latency">–</b><span>avg latency</span></div>
    </section>
    <section>
      <div class="row">
        <label>Sensitivity</label>
        <div class="seg" id="sensitivity"></div>
      </div>
      <div class="row">
        <label>Hidden posts</label>
        <div class="seg" id="display">
          <button data-v="collapse" title="Replace with a slim line you can expand">Slim line</button>
          <button data-v="remove" title="Remove from the feed entirely">Remove</button>
        </div>
      </div>
    </section>
    <div class="list-head">
      <h2>Recently hidden</h2>
      <span class="muted" style="font-size: 12px">👍 if it should've stayed</span>
    </div>
    <div id="recent"></div>
    <footer>
      <span id="learned">No votes yet</span>
      <a href="options.html" target="_blank">Settings</a>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
